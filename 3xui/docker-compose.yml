services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:2.8.9
    container_name: 3xui
    volumes:
      - ${DATA_PATH}/3xui/db/:/etc/x-ui/
      - ${DATA_PATH}/3xui/cert/:/root/cert/
    ports:
      - "49001-49020:49001-49020"
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=true
      - TZ=Asia/Shanghai
    # Fail2Ban 需要 NET_ADMIN 权限才能操作 iptables
    cap_add:
      - NET_ADMIN
    tty: true
    restart: unless-stopped
    healthcheck:
      # 使用 wget 检查面板端口是否响应 (兼容性更好)
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2053/ || exit 1"]
      interval: 30s    # 每 30 秒检查一次
      timeout: 5s      # 超时时间
      retries: 3       # 连续失败 3 次标记为 unhealthy
      start_period: 60s # 增加启动宽限期，避免数据库初始化慢导致误判
    networks:
      - frontend
      - backend
