services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:3.2.7
    container_name: 3xui
    volumes:
      - ${DATA_PATH}/3xui/db/:/etc/x-ui/
      - ${DATA_PATH}caddy/certificates:/certs
    ports:
      - "49001-49010:49001-49010"
    environment:
      - TZ=Asia/Shanghai
      - XUI_LOG_LEVEL=info
      - XUI_ENABLE_FAIL2BAN=false
    cap_add:
      - NET_ADMIN
    tty: true
    restart: always
    healthcheck:
      # 使用 wget 检查面板端口是否响应 (兼容性更好)
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider -Y off http://127.0.0.1:2053/ || exit 1",
        ]
      interval: 60s # 每 30 秒检查一次
      timeout: 5s # 超时时间
      retries: 3 # 连续失败 3 次标记为 unhealthy
      start_period: 60s # 增加启动宽限期，避免数据库初始化慢导致误判
    networks:
      - proxy
