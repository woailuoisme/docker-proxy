pre-commit:
  parallel: true
  jobs:
    - name: validate docker-compose
      glob:
        - "docker-compose.yml"
        - "**/docker-compose.yml"
        - ".env.example"
      run: just validate-docker-compose

    - name: validate caddyfile
      glob:
        - "caddy/Caddyfile"
        - "caddy/templates/*.conf"
        - "caddy/snippets/*.conf"
        - "caddy/sites/*"
        - "caddy/Dockerfile"
        - "caddy/docker-compose.yml"
      run: docker info >/dev/null 2>&1 && just lint-caddy || echo "Docker 未运行，跳过 Caddy 配置验证"

    - name: hadolint
      glob:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
      run: hadolint {staged_files}

    - name: shellcheck
      glob:
        - "**/*.sh"
      run: shellcheck {staged_files}

    - name: shfmt
      glob:
        - "**/*.sh"
      run: shfmt -d {staged_files}
