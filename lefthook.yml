pre-commit:
  parallel: true
  jobs:
    - name: validate docker-compose
      glob:
        - "docker-compose.yml"
        - "**/docker-compose.yml"
        - ".env.example"
      run: just validate-docker-compose

    - name: hadolint
      glob:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
      run: hadolint {staged_files}

    - name: shellcheck
      glob:
        - "**/*.sh"
      run: shellcheck {staged_files}

    - name: shfmt
      glob:
        - "**/*.sh"
      run: shfmt -w {staged_files}

    - name: dotenv-linter
      glob:
        - "**/.env"
        - "**/.env.*"
        - "**/*.env"
      run: dotenv-linter check -i UnorderedKey {staged_files}
