services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v10.5.2
    depends_on:
      - socket-proxy
    restart: always
    ports:
      - "8180:8080"
    environment:
      NO_PROXY: localhost,127.0.0.1,socket-proxy
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375
      DOZZLE_NO_ANALYTICS: true
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
    networks:
      - proxy
