{$PREFIX_SITE_DOZZLE}.{$SITE_ADDRESS} {
    import ../snippets/request-log.conf
    import ../snippets/security.conf
    import ../snippets/basic-auth.conf

    encode zstd gzip

    reverse_proxy dozzle:8080 {
        # --- SSE & 实时日志优化 ---
        
        # -1 表示立即刷新缓冲区，对实时日志最友好
        flush_interval -1
        
        # 禁用响应超时，防止查看长日志时被断开
        header_timeout 0
        response_timeout 0

        transport http {
            # 强制 HTTP/1.1，避免 H2 多路复用在某些浏览器上的连接数限制导致 SSE 挂起
            versions h1
            
            # 适当加大读缓冲
            read_buffer 16k
            
            # 保持连接活跃
            idle_timeout 0
        }

        # 确保传递真实的客户端 IP 和 Host
        header_up Host {host}
        header_up X-Real-IP {remote_host}
        header_up X-Forwarded-For {remote_host}
    }
}