rd.{$SITE_ADDRESS} {
	import ../snippets/request-log.conf
	import ../snippets/security.conf
	import ../snippets/waf.conf

	encode zstd gzip

	# RustDesk Web Client WebSocket 代理
	# 用于支持 Web 版客户端连接 (https://web.rustdesk.com 或自建 Web Client)
	
	# ID Server WebSocket
	handle_path /ws/id {
		reverse_proxy hbbs:21118
	}

	# Relay Server WebSocket
	handle_path /ws/relay {
		reverse_proxy hbbr:21119
	}

	# 如果您有自建的 Web Client 静态页面，可以配置在这里
	# handle {
	# 	reverse_proxy rustdesk-web-client:80
	# }
    
    # 默认返回 200 OK，避免 404
    respond "RustDesk WebSocket Gateway" 200
}
