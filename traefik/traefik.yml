api:
  dashboard: true
  insecure: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false

serversTransport:
  insecureSkipVerify: true

log:
  level: INFO
  format: common

accessLog:
  format: common
  filters:
    statusCodes: ["400-599"]

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls: {}
      middlewares:
        - security-headers@file
    http2:
      maxConcurrentStreams: 250
    http3:
      advertisedPort: 443

providers:
  docker:
    endpoint: "http://socket-proxy:2375"
    exposedByDefault: false
    network: frontend
    watch: true
  file:
    directory: /config/dynamic
    watch: true

# 健康检查
ping:
  entryPoint: web   # 绑定到 80 端口

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{ env `ACME_EMAIL` }}"
      storage: /config/certs/acme.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      keyType: EC384
      httpChallenge:
        entryPoint: web

experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.5.0