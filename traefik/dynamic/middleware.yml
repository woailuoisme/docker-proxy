http:
  middlewares:
    # 1. 安全响应头 (已有的)
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: "strict-origin-when-cross-origin"

    # 2. Gzip 压缩 (大幅节省流量)
    compress:
      compress: {}

    # 3. 速率限制 (每秒 10 个请求，突发 50 个)
    rate-limit:
      rateLimit:
        average: 10
        burst: 50

    # 4. IP 白名单 (仅允许本地局域网和 Docker 网段访问)
    # 请根据您的实际网段调整
    local-ipwhite:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "192.168.0.0/16"
          - "172.16.0.0/12"
          - "10.0.0.0/8"

    # 5. 请求重试 (网络抖动时自动重试 3 次)
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # 6. 基本认证 (提供统一的后台保护)
    # 示例账号: admin / 密码: admin123!
    # 生成方式: echo $(htpasswd -nB user)
    basic-auth:
      basicAuth:
        users:
          - "admin:$2y$05$3e6ZfD7.L8mQ9Gz.7h1e.uzsM9r5XJ1E5g2A8rM6x6l5E4s3N2R1O"
    # 7. Authelia 身份验证
    authelia:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"
        # 建议在 Authelia 配置的 Session Cookies 部分配置 Authelia URL。
        # 如果需要在此处配置，请参考下行：
        # address: "http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"

    # 8. CrowdSec 插件
    crowdsec:
      plugin:
        crowdsec:
          enabled: true
          crowdsecLapiScheme: http
          crowdsecLapiHost: "{{ env `CROWDSEC_LAPI_HOST` }}"
          crowdsecLapiKey: "{{ env `CROWDSEC_LAPI_KEY` }}"
