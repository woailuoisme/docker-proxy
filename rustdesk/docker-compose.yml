# RustDesk 自建服务器配置
# 
# 容器说明:
# - hbbs (ID Server): 负责心跳检测和 ID 注册服务 (端口: 21115/tcp, 21116/tcp/udp, 21118/tcp)
# - hbbr (Relay Server): 负责中继数据传输服务 (端口: 21117/tcp, 21119/tcp)
#
# 客户端连接使用方法:
# 1. 下载并安装 RustDesk 客户端
# 2. 进入 设置 -> 网络 -> ID/中继服务器
# 3. 填写以下信息:
#    - ID 服务器: rd.{$SITE_ADDRESS}
#    - 中继服务器: rd.{$SITE_ADDRESS}
#    - Key (公钥): +XVnD9sdcfxWfc1Al45yNQY3DVO9ffhdb1I4vs99xLw=
#
# 注意: 公钥位于 data/rustdesk/id_ed25519.pub，首次启动会自动生成

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ${DATA_PATH}rustdesk:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    restart: unless-stopped
    networks:
      - frontend
      - backend

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ${DATA_PATH}rustdesk:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: unless-stopped
    networks:
      - frontend
      - backend
